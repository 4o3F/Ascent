name: Build Android APKs

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      debug_ssh:
        description: Open an SSH session (tmate) when the build fails
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 libclang-18-dev

      - name: Install Flutter dependencies
        run: flutter pub get

      # The release build type has no signingConfig, so these APKs are unsigned.
      - name: Build release APKs
        env:
          CMAKE_GENERATOR: Ninja
          # Pin bindgen to LLVM 18 instead of whichever libclang clang-sys finds first.
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          CLANG_PATH: /usr/bin/clang-18
        run: flutter build apk --release

      - name: Dump native build diagnostics
        if: failure()
        run: |
          set -uo pipefail
          ls -d /usr/lib/llvm-* || true
          find / -name 'libclang*.so*' -not -path '/proc/*' 2>/dev/null | sort || true
          for f in build/rust_lib_ascent/build/*/release/build/boring-sys-*/{output,stderr}; do
            [[ -f "$f" ]] || continue
            echo "::group::$f"
            cat -- "$f"
            echo '::endgroup::'
          done
          for f in build/rust_lib_ascent/build/*/release/build/boring-sys-*/out/bindings.rs; do
            [[ -f "$f" ]] && echo "$(wc -l < "$f") $f"
          done

      # Manual runs only; access is limited to the account that started the run.
      - name: SSH debug session
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.debug_ssh
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Collect unique APKs
        run: |
          set -euo pipefail
          mkdir -p unsigned-apks
          while IFS= read -r -d '' apk; do
            name="$(basename "$apk")"
            if [[ ! -f "unsigned-apks/$name" ]]; then
              cp -- "$apk" "unsigned-apks/$name"
            fi
          done < <(find build/app/outputs -type f -name 'ascent_*.apk' -print0 | sort -z)
          if ! compgen -G 'unsigned-apks/ascent_*.apk' > /dev/null; then
            echo '::error::No ascent_*.apk files found under build/app/outputs.'
            exit 1
          fi

      - name: Upload unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: ascent-unsigned-apks
          path: unsigned-apks/ascent_*.apk
          if-no-files-found: error
          retention-days: 14
